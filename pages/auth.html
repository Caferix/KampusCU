<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Giriş ve Kayıt Paneli</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="kutu">
        <div class="form-alanı">
            <h2>Giriş Yap</h2>
            <input type="text" placeholder="Kullanıcı Adı">
            <input type="password" placeholder="Şifre">
            <button onclick="alert('Giriş butonuna basıldı!')">Giriş</button>
        </div>

        <div class="çizgi"></div>

        <div class="form-alanı">
            <h2>Kayıt Ol</h2>
            <input type="text" placeholder="Ad Soyad">
            <input type="email" placeholder="E-posta">
            <input type="password" placeholder="Şifre Oluştur">
            <button onclick="alert('Kayıt butonuna basıldı!')">Kayıt Ol</button>
        </div>
    </div>

</body>
</html>
