<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş ve Kayıt | KampusCU</title>
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/auth.css">
</head>
<body>

    <div class="container auth-kapsayici">
        <div class="kart auth-kart">
            <h2 class="bolum-basligi">Giriş Yap</h2>
            <form id="girisForm">
                <div class="form-alani">
                    <label for="girisEmail">E-posta</label>
                    <input type="email" id="girisEmail" placeholder="e-posta@cumhuriyet.edu.tr" required>
                </div>
                <div class="form-alani">
                    <label for="girisSifre">Şifre</label>
                    <input type="password" id="girisSifre" placeholder="••••••••" required>
                </div>
                <button type="submit" class="buton tam">Giriş Yap</button>
            </form>
        </div>

        <div class="kart auth-kart">
            <h2 class="bolum-basligi">Kayıt Ol</h2>
            <form id="kayitForm">
                <div class="form-alani">
                    <label for="adSoyad">Ad Soyad</label>
                    <input type="text" id="adSoyad" placeholder="Erdem Taşar" required>
                </div>
                <div class="form-alani">
                    <label for="kayitEmail">E-posta</label>
                    <input type="email" id="kayitEmail" placeholder="e-posta@cumhuriyet.edu.tr" required>
                </div>
                <div class="form-alani">
                    <label for="kayitSifre">Şifre Oluştur</label>
                    <input type="password" id="kayitSifre" placeholder="••••••••" required>
                </div>
                <button type="submit" class="buton tam ikincil">Kayıt Ol</button>
            </form>
        </div>
    </div>

</body>
</html>
