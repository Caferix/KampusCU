<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş ve Kayıt — KampüsCÜ</title>
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/auth.css">
</head>
<body>

    <!-- Navbar -->
    <header class="header">
        <div class="container">
            <nav class="nav-icerik">
                <a href="../index.html" class="nav-logo" aria-label="KampüsCÜ ana sayfasına git">Kampüs<span class="logo-vurgu">CÜ</span></a>

                <ul class="nav-linkler" id="navMenu">
                    <li><a href="../index.html">Ana Sayfa</a></li>
                    <li><a href="ads.html">İlanlar</a></li>
                    <li><a href="events.html">Etkinlikler</a></li>
                    <li><a href="announcements.html">Duyurular</a></li>
                    <li><a href="map.html">Mekanlar</a></li>
                    <li><a href="about.html">Hakkımızda</a></li>
                </ul>

                <button class="hamburger" id="hamburger" aria-label="Menüyü aç">☰</button>
            </nav>
        </div>
    </header>

    <div class="container auth-kapsayici">
        <div class="kart auth-kart">
            <h2 class="bolum-basligi">Giriş Yap</h2>
            <form id="girisForm">
                <div class="form-alani">
                    <label for="girisEmail">E-posta</label>
                    <input type="email" id="girisEmail" placeholder="e-posta@cumhuriyet.edu.tr" required>
                </div>
                <div class="form-alani">
                    <label for="girisSifre">Şifre</label>
                    <input type="password" id="girisSifre" placeholder="••••••••" required>
                </div>
                <button type="submit" class="buton tam">Giriş Yap</button>
            </form>

            <button type="button" class="buton tam ikincil" id="demoGirisBtn" style="margin-top: var(--space-sm);">
                Demo ile Giriş Yap
            </button>
        </div>

        <div class="kart auth-kart">
            <h2 class="bolum-basligi">Kayıt Ol</h2>
            <form id="kayitForm">
                <div class="form-alani">
                    <label for="adSoyad">Ad Soyad</label>
                    <input type="text" id="adSoyad" placeholder="Erdem Taşar" required>
                </div>
                <div class="form-alani">
                    <label for="kayitEmail">E-posta</label>
                    <input type="email" id="kayitEmail" placeholder="e-posta@cumhuriyet.edu.tr" required>
                </div>
                <div class="form-alani">
                    <label for="kayitSifre">Şifre Oluştur</label>
                    <input type="password" id="kayitSifre" placeholder="••••••••" required>
                </div>
                <button type="submit" class="buton tam ikincil">Kayıt Ol</button>
            </form>
        </div>
    </div>

    <footer class="footer">
        <div class="container">
            <p>© 2026 KampüsCÜ · Sivas Cumhuriyet Üniversitesi Bilgisayar Mühendisliği Ekibi</p>
            <p>
                <a href="about.html">Hakkımızda</a> ·
                <a href="about.html#iletisim">İletişim</a> ·
                <a href="#">Gizlilik</a>
            </p>
        </div>
    </footer>

    <div class="toast-kapsayici" id="toastKapsayici"></div>

    <script src="../js/firebase-config.js"></script>
    <script src="../js/ui.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/common-page.js"></script>

</body>
</html>
